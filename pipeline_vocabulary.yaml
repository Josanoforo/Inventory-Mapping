# pipeline_vocabulary.yaml
# Source of truth for all closed enums across the DSC pipeline.
# If a schema or contract diverges from this file, this file wins.
#
# Fields are organized by scope: cross-phase first, then phase-specific.
# Phase-specific fields only appear in one phase and don't need cross-phase alignment.

# =============================================================================
# CROSS-PHASE FIELDS
# These appear in multiple phases. Values here are canonical.
# =============================================================================

actor:
  # Canonical name: actor
  # Called "actor_level" in Phase 1-2 schemas (legacy — unification pending)
  # Called "actor" in Phase 3 schemas and card_index.jsonl
  schema_field: [actor, actor_level]
  optional:
    - unknown  # Phase 3 schemas may omit unknown; Phase 1-2 schemas require it
  values:
    - buyer
    - seller
    - product
    - marketplace
    - platform
    - source
    - third_party
    - mixed
    - unknown        # Phase 1-2 only; Phase 3 does not use unknown
  assignment_rule: |
    Determined by source_type, not by topic. "Who speaks", not "who is affected."
    help_center, pricing_page, platform_doc, policy_page → platform
    blog / seller_forum / reddit (author = seller) → seller
    blog / reddit (author = buyer) → buyer
    search_results_page, category_page → marketplace
    product_listing, or promotional content from an external provider speaking in
    first person about their own product or service → third_party
    commentary or analysis without first-person actor → source
    See: signal_extraction_contract §7 Principle 3
  notes:
    - "'platform' = official voice, explicit policy."
    - "'marketplace' = algorithmic output, no explicit commitment."
    - "'third_party' = a third party speaking in first person to sell or promote its own product or service — NOT a seller of the marketplace under study. Distinct from 'source', which is commentary or analysis with no first-person actor."
    - "'source' and 'mixed' trigger needs_audit in Phase 3 scanner (not eligible for cross-actor filter). — PREMISA-FALSA (S37, D-268): ninguna skill de scan implementa esta excepción. El filtro same-actor de las cuatro skills es puramente mecánico y no distingue valores de actor. Medido sobre el historial completo (639 commits): la conducta nunca existió, ni antes ni después de que esta línea se escribiera. Además, el needs_audit de esta nota (sobre el valor del actor) y el de 04_scanner.md (soporte parcial del patrón) son conceptos distintos con el mismo nombre. Esta línea no describe conducta vigente. Si la excepción debe existir es pregunta abierta — ver P-207 en state/pendientes_ledger.md. Evidencia: state/output/excepcion_same_actor_S37.md."
    - "Collapsing actor without declaring it is a rework-level failure."
    - "NOTA DE FRONTERA (D-272, D-251): el mapeo actor_level: unknown → source vive en la frontera Phase 2 → Phase 3 y hoy no tiene superficie de implementación — no se ejecuta sobre el corpus. Los records de Phase 1 con actor_level: unknown se quedan en unknown; D-251 fija explícitamente que es información real sobre la fuente y no se tira. Lo que D-272 cambia es qué hace Phase 3 en la frontera al consumir ese valor, no lo que Phase 1 registra."

metric_type:
  values:
    # mag_ — magnitude values (R9(a): metric_type describes the magnitude, not the claim)
    - mag_revenue
    - mag_profit
    - mag_payout
    - mag_fee_rate
    - mag_traffic_volume
    - mag_active_buyers
    - mag_monthly_visitors
    - mag_sales_count
    - mag_conversion_rate
    - mag_review_count
    - mag_price
    - mag_time_to_first_sale
    - mag_rate
    - mag_volume
    - mag_count
    - mag_buyer_count
    - mag_subscriber_count
    - mag_share
    - mag_commission_rate
    - mag_traffic
    - mag_discount_rate
    # qual_ — conservation corral (D-287): values R9(a) strict would not admit as magnitude,
    # kept populated and prefixed per D-251 (information that passed Phases 0-2 is not discarded)
    - qual_search_discovery
    - qual_first_sale
    - qual_review_requirement
    - qual_activation_requirement
    - qual_payment_method_availability
    - qual_payout_method_availability
    - qual_discoverability_claim
    - qual_refund_policy
    - unknown  # sentinel, declared exemption from mag_/qual_ prefixing — see family note below
  family_note: |
    D-287: the mag_/qual_ prefix marks magnitude vs non-magnitude per R9(a) (metric_type
    describes the magnitude, not the claim). It is a downstream comparability filter, not
    a new axis. qual_ is a conservation corral: it groups values that strict R9(a) would not
    admit as magnitude; they stay populated and prefixed per D-287, consistent with D-251
    (information that passed Phases 0-2 is not discarded), and are not retired because P-191
    requires a count across all layers before retirement. R9(c) is the protection that
    prevents forcing values between distinct economic layers across mag_/qual_.

