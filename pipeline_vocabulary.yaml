# pipeline_vocabulary.yaml
# Source of truth for all closed enums across the DSC pipeline.
# If a schema or contract diverges from this file, this file wins.
#
# Fields are organized by scope: cross-phase first, then phase-specific.
# Phase-specific fields only appear in one phase and don't need cross-phase alignment.

# =============================================================================
# CROSS-PHASE FIELDS
# These appear in multiple phases. Values here are canonical.
# =============================================================================

actor:
  # Canonical name: actor
  # Called "actor_level" in Phase 1-2 schemas (legacy — unification pending)
  # Called "actor" in Phase 3 schemas and card_index.jsonl
  values:
    - buyer
    - seller
    - product
    - marketplace
    - platform
    - source
    - third_party
    - mixed
    - unknown        # Phase 1-2 only; Phase 3 does not use unknown
  # vocab_check.py verification config:
  schema_field: [actor, actor_level]
  optional: [unknown]  # Phase 3 schemas legitimately omit unknown
  assignment_rule: |
    Determined by source_type, not by topic. "Who speaks", not "who is affected."
    help_center, pricing_page, platform_doc, policy_page → platform
    blog / seller_forum / reddit (author = seller) → seller
    blog / reddit (author = buyer) → buyer
    search_results_page, category_page → marketplace
    product_listing, or promotional content from an external provider speaking in
    first person about their own product or service → third_party
    commentary or analysis without first-person actor → source
    See: signal_extraction_contract §7 Principle 3
  notes:
    - "'platform' = official voice, explicit policy."
    - "'marketplace' = algorithmic output, no explicit commitment."
    - "'third_party' = a third party speaking in first person to sell or promote its own product or service — NOT a seller of the marketplace under study. Distinct from 'source', which is commentary or analysis with no first-person actor."
    - "'source' and 'mixed' trigger needs_audit in Phase 3 scanner (not eligible for cross-actor filter)."
    - "Collapsing actor without declaring it is a rework-level failure."

