# =============================================================================
# MECHANICAL LANGUAGE RULES (apply to all phases)
# =============================================================================

allowed_verbs:
  values:
    - aparece
    - co-ocurre
    - contradice
    - se distribuye
    - no se encontró
    - se concentra
    - se separa en polos
    - no converge

forbidden_language:
  values:
    - importante
    - fuerte
    - central
    - revela que
    - demuestra que
    - necesidad
    - solución
    - recomendación
    - sugiere que
