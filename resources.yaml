# resources.yaml — autoridad de recursos del repo (E-REG-0, S38)
#
# Patrón vocabulario aplicado a artefactos: este archivo es la autoridad;
# state/scripts/resource_check.py es el verificador. MAP.md como vista
# derivada es un paso posterior (fuera de este encargo).
#
# Formato por fila:
#   path: ruta exacta o glob (fnmatch: '*' cruza separadores de directorio;
#         una ruta terminada en '/' cubre todo su subárbol por prefijo)
#   clase: permanente | derivado | por-corrida | fixture | reporte
#   fase: "00".."03" | "state" | "repo"
#   productor: [skills, scripts o módulos] — [] si no derivable
#   consumidores: [skills, scripts o módulos] — [] si no derivable; [operador] válido
#   autoridad: vigente | espejo | obsoleto | sin-marcar   (opcional)
#
# Comentario `# src:X` al final de cada fila = fuente de siembra:
#   a  = tablas "Quick navigation" de CLAUDE.md
#   b  = grep de rutas working/·output/·state/output/·input/ en
#        .claude/skills/*/SKILL.md, phases/**/modules/*.md,
#        phases/**/scripts/*.py, state/scripts/*.py, vocab_check.py
#   c  = git ls-files, clasificación por directorio raíz
#   rl = R-L, auto-aplicación (este archivo y su verificador)
# El bloque fuera_del_arbol (fuente d) tiene su propia sección al final.

